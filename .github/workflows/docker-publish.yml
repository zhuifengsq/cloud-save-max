name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '*.md'
      - 'assets/**'
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - run: python -m pip install -r requirements.txt -r requirements-dev.txt
    - name: Run complete backend tests
      env:
        XXM_TESTING: '1'
        DATABASE_URL: 'sqlite://'
        RUN_MIGRATIONS: '0'
        SCHEDULER_ENABLED: '0'
      run: python -m pytest tests regression_tests -q
    - name: Verify migrations
      env:
        XXM_TESTING: '1'
        DATABASE_URL: sqlite:///${{ runner.temp }}/cloud-save-migration.db
      run: |
        python -m alembic upgrade 20261105_credits_in_media_cache
        python -m alembic upgrade head
        python -m alembic downgrade 20261105_credits_in_media_cache
        python -m alembic upgrade head

  build:
    needs: backend
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Generate version
      id: version
      run: |
        if [ "${{ github.ref_type }}" = "tag" ]; then
          echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        else
          echo "version=$(TZ=Asia/Shanghai date +'%y.%-m.%-d')" >> $GITHUB_OUTPUT
        fi

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/cloud-save-max:latest,${{ secrets.DOCKERHUB_USERNAME }}/cloud-save-max:${{ steps.version.outputs.version }}
